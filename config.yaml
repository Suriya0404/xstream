mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: xstream123  # Override with MYSQL_PASSWORD env var in production
  database: xstream

kafka:
  bootstrap_servers: localhost:9092
  schema_registry_url: http://localhost:8081

scylladb:
  contact_points:
    - localhost
  port: 9042
  keyspace: xstream
  username: ""
  password: ""

clickhouse:
  host: localhost
  port: 9000
  http_port: 8123
  database: xstream
  user: default
  password: ""

flink:
  jobmanager_url: http://localhost:8082
  sql_gateway_url: http://localhost:8083
  parallelism: 4
  checkpointing_interval_ms: 10000

anthropic:
  api_key: ""  # Override with ANTHROPIC_API_KEY env var in production

cors:
  allowed_origins:
    - http://localhost:5173
    - http://localhost:8000

jobs_repo:
  path: ../x-stream-jobs  # relative to project root; override with JOBS_REPO_PATH env var

finnhub:
  api_key: ""  # Override with FINNHUB_API_KEY env var in production
  symbols:
    - AAPL
    - MSFT
    - BINANCE:BTCUSDT
  topics:
    trades: finnhub-trades
    quotes: finnhub-quotes
    enriched: finnhub-enriched
  quote_poll_interval_s: 10
