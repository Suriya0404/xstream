version: "3.8"

# x-stream: streaming data platform sandbox
# Services: Zookeeper, Kafka, Schema Registry, ScyllaDB, Flink, MySQL, ClickHouse, Backend API

networks:
  xstream-net:
    driver: bridge

volumes:
  scylla-data:
  mysql-data:
  clickhouse-data:
  flink-checkpoints:
  mongo-data:

services:

  # ── Zookeeper (Kafka dependency) ──────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: xstream-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - xstream-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | (exec 3<>/dev/tcp/localhost/2181; echo ruok >&3; cat <&3) 2>/dev/null | grep imok || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: xstream-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - xstream-net
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Schema Registry ───────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.3
    container_name: xstream-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - xstream-net

  # ── ScyllaDB ─────────────────────────────────────────
  scylladb:
    image: scylladb/scylla:5.4
    container_name: xstream-scylladb
    restart: unless-stopped
    ports:
      - "9042:9042"
      - "9160:9160"
    volumes:
      - scylla-data:/var/lib/scylla
    command: --smp 1 --memory 512M --overprovisioned 1
    networks:
      - xstream-net
    healthcheck:
      test: cqlsh -e "describe keyspaces"
      interval: 30s
      timeout: 10s
      retries: 10

  # ── MySQL (pipeline config store) ────────────────────
  mysql:
    image: mysql:8.0
    container_name: xstream-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: xstream123
      MYSQL_DATABASE: xstream
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - xstream-net
    healthcheck:
      test: mysqladmin ping -h localhost -u root -pxstream123
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Flink Job Manager ─────────────────────────────────
  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    # amd64: apache-flink (PyFlink) publishes no arm64 wheel, so run x86_64 (emulated
    # on Apple Silicon) where the manylinux wheel installs.
    platform: linux/amd64
    container_name: xstream-flink-jobmanager
    restart: unless-stopped
    ports:
      - "8082:8081"   # Flink UI
      - "8083:8083"   # SQL Gateway
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        sql-gateway.endpoint.rest.address: 0.0.0.0
        sql-gateway.endpoint.rest.port: 8083
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks:
      - xstream-net
    healthcheck:
      test: curl -f http://localhost:8081/overview || exit 1
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Flink Task Manager ────────────────────────────────
  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    platform: linux/amd64  # match jobmanager (PyFlink amd64 wheel)
    container_name: xstream-flink-taskmanager
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1728m
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    networks:
      - xstream-net

  # ── ClickHouse (final reporting sink) ─────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: xstream-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native interface
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - xstream-net
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  # ── MongoDB (Flink sink target) ───────────────────────
  mongo:
    image: mongo:7
    container_name: xstream-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - xstream-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── x-stream Backend API ──────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: xstream-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CONFIG_PATH: /app/config.yaml
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JOBS_REPO_PATH: /jobs
      FLINK_DOCKER_CONTAINER: xstream-flink-jobmanager
    volumes:
      - ./config-docker.yaml:/app/config.yaml:ro
      - ../../x-stream-jobs:/jobs  # generated Flink jobs and workflow YAMLs
      - /var/run/docker.sock:/var/run/docker.sock  # to launch Flink jobs via flink_job_control.py
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - xstream-net

  # ── Finnhub real-time producer ────────────────────────
  finnhub-producer:
    build:
      context: ../producer
      dockerfile: Dockerfile
    container_name: xstream-finnhub-producer
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config.yaml
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    volumes:
      - ./config-docker.yaml:/app/config.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - xstream-net

  # ── ScyllaDB Kafka consumer ───────────────────────────
  scylla-consumer:
    build:
      context: ../producer
      dockerfile: Dockerfile
    container_name: xstream-scylla-consumer
    restart: unless-stopped
    command: ["python", "-u", "scylla_consumer.py"]
    environment:
      CONFIG_PATH: /app/config.yaml
      JOBS_REPO_PATH: /jobs
    volumes:
      - ./config-docker.yaml:/app/config.yaml:ro
      - ../../x-stream-jobs:/jobs
    depends_on:
      kafka:
        condition: service_healthy
      scylladb:
        condition: service_healthy
    networks:
      - xstream-net
